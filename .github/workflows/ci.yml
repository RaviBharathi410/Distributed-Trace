name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (Go 1.22)
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.3-alpine
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 9000:9000
          - 8123:8123
        options: >-
          --health-cmd "wget --spider -q http://127.0.0.1:8123/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Verify dependencies
        run: go mod download

      - name: Build backend
        run: go build -v ./...

      - name: Build standalone server binary
        run: go build -v -o bin/server ./cmd/server

      # Container orchestration rationale: ClickHouse uses GitHub Actions native `services:` because it requires standard flags.
      # Redpanda is orchestrated via `docker compose up -d redpanda` because single-node Redpanda requires specialized startup CLI flags
      # (--smp 1, --memory 1G, --reserve-memory 0M, --overprovisioned, and dual PLAINTEXT/OUTSIDE advertised listeners) which are centrally
      # managed in docker-compose.yml as the single source of truth without shell escaping issues in the Actions services block.
      - name: Start Redpanda test broker
        run: |
          docker compose up -d redpanda
          for i in $(seq 1 30); do
            if docker compose exec -T redpanda rpk cluster health 2>/dev/null | grep -q 'HEALTHY'; then
              echo "Redpanda broker cluster is HEALTHY on port 9092"
              break
            fi
            echo "Waiting for Redpanda cluster..."
            sleep 1
          done

      - name: Run unit & regression tests with coverage
        run: |
          set -o pipefail
          go test -v -race -cover ./internal/analysis/... ./internal/api/... ./internal/auth/... ./internal/ingest/... ./internal/repository/clickhouse/... 2>&1 | tee test_output.log || {
            status=$?
            echo "### ❌ Go Test Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 60 test_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $status
          }
        env:
          CLICKHOUSE_URL: 127.0.0.1:9000
          KAFKA_BROKERS: 127.0.0.1:9092

  frontend:
    name: Frontend (Node 20 / Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck & Vite build
        run: npm run build

  e2e-smoke:
    name: E2E Smoke (Phase 1 Full Stack & Real OTLP Ingest)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Start full stack with clean volumes
        run: |
          docker compose down -v
          docker compose up -d postgres clickhouse redpanda redis
          echo "Waiting for services to become healthy..."
          for i in $(seq 1 45); do
            pg_ready=false
            ch_ready=false
            rp_ready=false
            if docker compose exec -T postgres pg_isready -U postgres -d distributedtrace 2>/dev/null; then pg_ready=true; fi
            if docker compose exec -T clickhouse wget --spider -q http://127.0.0.1:8123/ping 2>/dev/null; then ch_ready=true; fi
            if docker compose exec -T redpanda rpk cluster health 2>/dev/null | grep -q 'HEALTHY'; then rp_ready=true; fi
            if [ "$pg_ready" = "true" ] && [ "$ch_ready" = "true" ] && [ "$rp_ready" = "true" ]; then
              echo "All database and streaming services are HEALTHY!"
              break
            fi
            echo "Waiting ($i/45)... pg=$pg_ready, ch=$ch_ready, rp=$rp_ready"
            sleep 1
          done

      - name: Apply database migrations
        run: go run cmd/migrate/main.go
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/distributedtrace?sslmode=disable
          CLICKHOUSE_URL: 127.0.0.1:9000
          CLICKHOUSE_DB: default

      - name: Start DistributedTrace server
        run: |
          go run cmd/server/main.go > server.log 2>&1 &
          echo $! > server.pid
          sleep 3
        env:
          SERVER_PORT: 8080
          ENVIRONMENT: development
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/distributedtrace?sslmode=disable
          CLICKHOUSE_URL: 127.0.0.1:9000
          REDIS_URL: redis://localhost:6379
          KAFKA_BROKERS: localhost:9092
          ALLOWED_ORIGIN: http://localhost:5173

      - name: Run E2E Smoke Verification Flow
        run: go run cmd/e2e-smoke/main.go
        env:
          SERVER_BASE_URL: http://localhost:8080

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "=== Server Output ==="
          cat server.log || true

