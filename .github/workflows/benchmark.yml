name: Empirical Storage & Ingestion Benchmark

on:
  workflow_dispatch:
    inputs:
      spans:
        description: 'Total number of spans to ingest'
        required: true
        default: '1000000'
        type: string
      batch_size:
        description: 'Spans per OTLP request batch'
        required: true
        default: '8192'
        type: string
  push:
    branches:
      - 'benchmark*'
  # schedule:
  #   - cron: '0 2 * * *' # Nightly at 2am UTC (temporarily disabled until manual run verified)

jobs:
  benchmark:
    name: Full-Stack Ingest & system.parts Benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: distributedtrace
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d distributedtrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:24.3-alpine
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 9000:9000
          - 8123:8123
        options: >-
          --health-cmd "wget --spider -q http://127.0.0.1:8123/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Start Redpanda streaming broker
        run: |
          docker compose up -d redpanda
          for i in $(seq 1 45); do
            if docker compose exec -T redpanda rpk cluster health 2>/dev/null | grep -q 'HEALTHY'; then
              echo "Redpanda broker cluster is HEALTHY on port 9092"
              break
            fi
            echo "Waiting for Redpanda cluster ($i/45)..."
            sleep 1
          done
          docker compose exec -T redpanda rpk topic create otel-spans -p 1 2>/dev/null || true

      - name: Build binaries
        run: |
          go build -v -o bin/server ./cmd/server
          go build -v -o bin/migrate ./cmd/migrate
          go build -v -o bin/loadtest ./cmd/loadtest

      - name: Apply database migrations
        run: ./bin/migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/distributedtrace?sslmode=disable
          CLICKHOUSE_URL: 127.0.0.1:9000
          CLICKHOUSE_DB: default

      - name: Start DistributedTrace server
        run: |
          ./bin/server > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8080/health | grep -q '"ok"'; then
              echo "Server is UP and HEALTHY on port 8080 at ($i/30)s"
              break
            fi
            echo "Waiting for server to become ready ($i/30)..."
            sleep 1
          done
        env:
          SERVER_PORT: 8080
          ENVIRONMENT: development
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/distributedtrace?sslmode=disable
          CLICKHOUSE_URL: 127.0.0.1:9000
          REDIS_URL: redis://127.0.0.1:6379
          KAFKA_BROKERS: 127.0.0.1:9092
          KAFKA_ALLOW_AUTO_TOPIC_CREATION: "true"
          KAFKA_MIN_BYTES: 10000
          ALLOWED_ORIGIN: http://localhost:5173

      - name: Capture baseline container resource metrics
        run: |
          echo "### 📊 Container Resource Utilization (Baseline Idle)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          docker stats --no-stream >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker stats --no-stream

      - name: Run Empirical Ingestion Load with Continuous Resource Sampling
        run: |
          SPANS="${{ inputs.spans || (contains(github.ref, '100k') && '100000' || '1000000') }}"
          BATCH="${{ inputs.batch_size || '8192' }}"
          echo "Executing live empirical benchmark: $SPANS spans (batch size: $BATCH)..."

          # 1. Start continuous background container and host server process stats sampler (every 2 seconds)
          SERVER_PID=$(cat server.pid 2>/dev/null || echo "")
          echo "container,cpu_perc,mem_usage,mem_perc" > docker-stats-samples.csv
          (
            while true; do
              # Sample docker containers
              docker stats --no-stream --format "{{.Name}},{{.CPUPerc}},{{.MemUsage}},{{.MemPerc}}" >> docker-stats-samples.csv 2>/dev/null || true

              # Sample Go server host process (API, Kafka consumer, anomaly engine)
              if [ -n "$SERVER_PID" ] && kill -0 "$SERVER_PID" 2>/dev/null; then
                ps_out=$(ps -o %cpu,rss -p "$SERVER_PID" --no-headers 2>/dev/null || true)
                if [ -n "$ps_out" ]; then
                  read -r proc_cpu proc_rss <<< "$ps_out"
                  echo "server-process-binary,${proc_cpu}%,${proc_rss}KiB,0.0%" >> docker-stats-samples.csv
                fi
              fi
              sleep 2
            done
          ) &
          SAMPLER_PID=$!

          # 2. Run loadtest
          ./bin/loadtest -mode live -spans "$SPANS" -batch-size "$BATCH" \
            -server http://127.0.0.1:8080 \
            -clickhouse 127.0.0.1:9000 \
            -query-bench-rows 20000000 \
            -output-json benchmark-results.json \
            -output-md benchmark-report.md 2>&1 | tee loadtest.log
          LOADTEST_EXIT=${PIPESTATUS[0]}

          # 3. Stop background stats sampler
          kill $SAMPLER_PID 2>/dev/null || true
          wait $SAMPLER_PID 2>/dev/null || true

          # 4. Compute Time-Series Average and Peak Resource Utilization
          python3 - << 'EOF'
          import csv, re
          from collections import defaultdict

          def parse_mem_mb(mem_str):
              part = mem_str.split('/')[0].strip()
              m = re.match(r'([\d\.]+)\s*([A-Za-z]+)', part)
              if not m:
                  return 0.0
              val, unit = float(m.group(1)), m.group(2).lower()
              if 'k' in unit: return val / 1024.0
              if 'm' in unit: return val
              if 'g' in unit: return val * 1024.0
              return val

          stats = defaultdict(lambda: {'cpu': [], 'mem_mb': []})
          try:
              with open('docker-stats-samples.csv', 'r') as f:
                  reader = csv.reader(f)
                  next(reader, None)
                  for row in reader:
                      if len(row) < 4:
                          continue
                      name, cpu_str, mem_str = row[0], row[1], row[2]
                      try:
                          cpu = float(cpu_str.replace('%', '').strip())
                          mem = parse_mem_mb(mem_str)
                          stats[name]['cpu'].append(cpu)
                          stats[name]['mem_mb'].append(mem)
                      except Exception:
                          continue
          except Exception as e:
              print(f"Error reading stats: {e}")

          if stats:
              md_lines = ["\n## 7. Sustained Host & Container Resource Utilization (Time-Series Sampled)\n\n"]
              md_lines.append("| Process / Container | Peak CPU % | Avg CPU % | Peak RAM (MB) | Avg RAM (MB) | Samples |\n")
              md_lines.append("|---|---|---|---|---|---|\n")
              for c_name, d in sorted(stats.items()):
                  cpus = d['cpu']
                  mems = d['mem_mb']
                  if not cpus:
                      continue
                  peak_cpu = max(cpus)
                  avg_cpu = sum(cpus) / len(cpus)
                  peak_mem = max(mems)
                  avg_mem = sum(mems) / len(mems)
                  displayName = f"`{c_name}`"
                  if c_name == 'server-process-binary':
                      displayName = "`server-process` (Go Ingest/Consumer)"
                  md_lines.append(f"| {displayName} | **{peak_cpu:.2f}%** | {avg_cpu:.2f}% | **{peak_mem:.1f} MB** | {avg_mem:.1f} MB | {len(cpus)} |\n")
              md_lines.append("\n> [!NOTE]\n> Continuous background sampling captured every 2s during sustained ingestion load.\n")
              md_lines.append("> **Process Sizing Disclaimer:** The server binary (`bin/server`) and the load generator (`bin/loadtest`) run directly on the host runner and share the runner's 2–4 vCPUs. The load generator's CPU footprint is co-located on the same box, so host resource readings are indicative of shared test-runner overhead, not dedicated production VM sizing.\n\n")

              with open('benchmark-report.md', 'a') as f:
                  f.writelines(md_lines)
          EOF

          if [ -f benchmark-report.md ]; then
            cat benchmark-report.md >> $GITHUB_STEP_SUMMARY
          fi

          if [ $LOADTEST_EXIT -ne 0 ]; then
            echo "Loadtest failed with exit code $LOADTEST_EXIT"
            exit $LOADTEST_EXIT
          fi
        env:
          CLICKHOUSE_URL: 127.0.0.1:9000
          CLICKHOUSE_DB: default

      - name: Upload Benchmark Results Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: empirical-storage-benchmark-${{ github.run_number }}
          path: |
            benchmark-results.json
            benchmark-report.md
            docker-stats-samples.csv
            loadtest.log
          if-no-files-found: warn

      - name: Publish benchmark report to benchmark-results branch
        if: always() && hashFiles('benchmark-report.md') != ''
        run: |
          REPORT_DATE=$(date -u +"%Y-%m-%d")
          RUN_NUM="${{ github.run_number }}"
          BRANCH_NAME="benchmark-results"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/bench-reports
          cp benchmark-report.md /tmp/bench-reports/report.md
          if [ -f benchmark-results.json ]; then
            cp benchmark-results.json /tmp/bench-reports/results.json
          fi

          git fetch origin "$BRANCH_NAME" 2>/dev/null || true
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            git checkout "$BRANCH_NAME"
            git pull origin "$BRANCH_NAME" --ff-only || true
          else
            git checkout --orphan "$BRANCH_NAME"
            git rm -rf . 2>/dev/null || true
          fi

          mkdir -p reports
          cp /tmp/bench-reports/report.md "reports/${REPORT_DATE}-run-${RUN_NUM}.md"
          cp /tmp/bench-reports/report.md "reports/latest.md"
          if [ -f /tmp/bench-reports/results.json ]; then
            cp /tmp/bench-reports/results.json "reports/${REPORT_DATE}-run-${RUN_NUM}.json"
            cp /tmp/bench-reports/results.json "reports/latest.json"
          fi

          git add reports/
          git commit -m "docs(benchmark): publish empirical results for run ${RUN_NUM} [skip ci]" || echo "No changes to commit"
          git push origin "$BRANCH_NAME" || echo "Push to $BRANCH_NAME failed, continuing..."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "=== Server Output ==="
          cat server.log || true
          echo "=== Redpanda Container Logs ==="
          docker compose logs --tail=50 redpanda || true
